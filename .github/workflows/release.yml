name: Windows portable release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify portable ZIP
        shell: pwsh
        run: ./scripts/Build-Portable.ps1 -OutputDirectory "$PWD/dist"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "dist/ARC-Blueprint-Map-Windows-x64.zip" --generate-notes
